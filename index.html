  <style>
    :root {
      --desk: #d9c6a5;
      --deskdark: #c3ae88;
      --strip: #156ed4;
      --ink: #26323f;
      --paper: #fffdf5;
      --hl: #ffe45e;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    @media(prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --desk: #3a3128;
        --deskdark: #2b231c
      }
    }

    :root[data-theme="dark"] {
      --desk: #3a3128;
      --deskdark: #2b231c
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    * {
      box-sizing: border-box
    }

    /* Footer Layout Structure */
    .footer-content {
      display: flex;
      flex-direction: column;
      align-items: left;
      gap: 1rem;
      width: 100%;
    }

    .footer-row {
      display: flex;
      justify-content: left;
      align-items: left;
      width: 100%;
      margin-bottom: 1rem;
    }

    .footer-social-row {
      display: flex-start;
      flex-wrap: wrap;
      justify-content: left;
      align-items: left;
      gap: 1.25rem;
      width: 100%;
    }

    /* Forces the paragraph to take up the full row, pushing the icons underneath */
    .footer-social-row p {
      flex: 0 0 100%;
      text-align: left;
      margin: 0;
    }

    html,
    body {
      height: 100%;
      margin: 0
    }

    body {
      background: radial-gradient(circle at 30% 20%, var(--desk), var(--deskdark));
      font-family: 'Patrick Hand', 'Comic Sans MS', cursive;
      color: var(--ink);
      overflow: hidden;
      display: grid;
      place-items: center
    }

    #bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none
    }

    #pad {
      container-type: inline-size;
      position: relative;
      width: min(94vw, calc((100dvh - 28px) * .74));
      aspect-ratio: 3/4;
      background: #fff8;
      border-radius: 1.5cqw;
      box-shadow: 0 2.5cqw 4cqw #0006, 0 .6cqw 0 #0002;
      display: flex;
      flex-direction: column
    }

    #strip {
      background: var(--strip);
      height: 9cqw;
      border-radius: 1.5cqw 1.5cqw 0 0;
      display: flex;
      align-items: center;
      gap: 1.2cqw;
      padding: 0 2.5cqw;
      color: #fff;
      font-family: Caveat, cursive;
      font-size: 4.6cqw;
      box-shadow: inset 0 -.8cqw 0 #0003;
      z-index: 999
    }

    #strip button,
    #strip a {
      font: inherit;
      line-height: 1;
      color: #fff;
      background: #0002;
      border: .35cqw dashed #fff9;
      border-radius: 1.2cqw;
      min-width: 6.2cqw;
      height: 6.4cqw;
      padding: 0 1.5cqw 0;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }

    #strip button:hover,
    #strip button:focus-visible,
    #strip a:hover,
    #strip a:focus-visible {
      background: #0004;
      outline: .4cqw solid var(--hl)
    }

    #strip button.active {
      background: #fff4;
      border-style: solid;
      font-weight: bold
    }

    .logoDisplay .logo {
      height: 50cqw;
      max-width: 80%;
      object-fit: contain;
      display: block;
      margin: 0 auto;
    }

    .linkDisplay {
      display: flex;
      gap: 1.5cqw;
      align-items: center;
      flex-direction: column;
      gap: 0.75rem;
    }

    .social-icon {
      width: 5cqw;
      height: 5cqw;
      max-width: 2rem;
      max-height: 2rem;
      object-fit: contain;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .social-icon:hover {
      transform: scale(1.15);
      opacity: 0.85;
    }

.description-col {
  max-height: 48cqw;        
  overflow-y: auto;
  padding-right: 1.5cqw;    
  overscroll-behavior: contain;
  touch-action: pan-y;        
  scrollbar-width: thin;  
  scrollbar-color: var(--strip) transparent;
}
.description-col::-webkit-scrollbar { width: 6px; }
.description-col::-webkit-scrollbar-thumb {
  background: var(--strip);
  border-radius: 6px;
}

    #area {
      position: relative;
      flex: 1;
      perspective: 1100px
    }

    .sheet {
      position: absolute;
      inset: 0;
      background: var(--paper) repeating-linear-gradient(transparent 0 5.9cqw, #7aa8d233 5.9cqw 6.1cqw);
      box-shadow: 0 .4cqw 1.2cqw #0004;
      transform-origin: 50% 0;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      font-size: 3.7cqw;
      line-height: 1.3;
      cursor: grab;
      overflow: hidden;
      will-change: transform
    }

    .sheet::before {
      content: "";
      position: absolute;
      left: 5cqw;
      top: 0;
      bottom: 0;
      width: .3cqw;
      background: #e2563b55
    }

    .inner {
      position: absolute;
      inset: 3.5cqw 4cqw 8cqw 8cqw;
      overflow: hidden
    }

    .inner>* {
      margin: 0 0 2cqw
    }

    h2 {
      font-family: Caveat, cursive;
      font-size: 8cqw;
      line-height: 1;
      transform: rotate(-1.5deg);
      background: linear-gradient(transparent 62%, var(--hl) 62%);
      display: inline-block
    }

    h3 {
      font-family: Caveat, cursive;
      font-size: 5cqw;
      margin: 0 0 .5cqw;
      color: var(--strip)
    }

    .tag {
      display: inline-block;
      border: .35cqw solid var(--ink);
      border-radius: 5cqw 4cqw 6cqw 3cqw;
      padding: 0 1.8cqw;
      margin: 0 1cqw 1cqw 0
    }

    a {
      color: #1d5fd1
    }

    .vgrid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2cqw 3cqw;
    }

    .vblock {
      margin: 0 !important;
    }


    .vid {
      aspect-ratio: 16/9;
      width: 100%;
      background: #222 center / cover no-repeat;
      border: 0;
      border-radius: 1cqw;
      color: #fff;
      font: inherit;
      cursor: pointer;
      display: block;
      position: relative;
      padding: 0;
    }

    .tech-items {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      /* Allows them to wrap to the next line if there are too many */
      gap: 1rem;
      /* Space between each tech card */
      align-items: center;
    }

    .vid .play {
      position: absolute;
      inset: 0;
      margin: auto;
      width: 9cqw;
      height: 9cqw;
      display: grid;
      place-items: center;
      font-size: 4.5cqw;
      background: #000a;
      border-radius: 50%;
      transition: transform .15s;
    }

    .vid:hover .play {
      transform: scale(1.12);
    }

    .consent-msg p {
      margin: 0 0 2cqw;
    }

    .consent-btn {
      font: inherit;
      font-family: Caveat, cursive;
      font-weight: 700;
      font-size: 5cqw;
      padding: .6cqw 3cqw;
      background: var(--strip);
      color: #fff;
      border: 0;
      border-radius: 2cqw;
      cursor: pointer;
    }

    .consent-btn:hover {
      filter: brightness(1.1);
    }


    iframe.vid {
      display: block
    }

    .curl {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 11cqw;
      height: 11cqw;
      border: 0;
      cursor: pointer;
      background: linear-gradient(315deg, transparent 50%, #d8d2bd 50%, #fff 75%);
      box-shadow: -.8cqw -.8cqw 1.5cqw #0003;
      border-top-left-radius: 100%;
      z-index: 5;
      font-size: 0
    }

    .logo-row {
      display: flex;
      align-items: center;
      justify-content: center;
      /* Centers the logo and links horizontally */
      gap: 1.5rem;
      /* Space between the logo and the vertical links */
    }

    .hint {
      position: absolute;
      right: 12cqw;
      bottom: 15cqw;
      font-family: Caveat, cursive;
      font-size: 5cqw;
      color: var(--strip);
      transform: rotate(-4deg);
      animation: bob 1.4s infinite;
      pointer-events: none
    }

    @keyframes bob {
      50% {
        transform: rotate(-4deg) translateY(-1.2cqw)
      }
    }

    .redraw .inner>* {
      animation: draw .55s ease-out both;
      animation-delay: calc(var(--i)*.13s)
    }

    @keyframes draw {
      from {
        clip-path: inset(0 100% 0 0)
      }

      to {
        clip-path: inset(0 0 0 0)
      }
    }

    .tech-icon {
      width: 1.2rem;
      height: 1.2rem;
    }

    /* Smooth lift effect on social icon hover */
    .footer-row a {
      margin-left: 0.3rem;
      display: inline-block;
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .footer-row a:hover {
      transform: translateY(-4px) scale(1.05);
    }

    .toolbar {
      display: flex;
      justify-content: flex-end;
      gap: 1.2cqw;
      margin-left: auto;
    }

    #strip #pl {
      background: white;
      color: black;
    }

    #strip #pl:hover,
    #strip #pl:focus-visible {
      color: gray;
    }
  </style>
</head>

    const jag = () => { let s = '0 0', n = 18; for (let i = 1; i < n; i++)s += `,${(i / n * 100).toFixed(1)}% ${(Math.random() * 1.4).toFixed(2)}%`; return `polygon(${s},100% 0,100% 100%,0 100%)` };
    function build() {
      const pg = pagesHTML(); area.innerHTML = '';
      sheets = pg.map((h, i) => {
        const e = document.createElement('section'); e.className = 'sheet'; e.dataset.r = (Math.random() * 3 - 1.5).toFixed(2);
        e.style.clipPath = jag(); e.innerHTML = `<div class="inner">${h}</div>`;
        [...e.firstChild.children].forEach((c, k) => c.style.setProperty('--i', k));
        if (i < pg.length - 1) { const b = document.createElement('button'); b.className = 'curl'; b.setAttribute('aria-label', T().ui.next); b.onclick = e2 => { e2.stopPropagation(); if (!e2.detail) next() }; e.append(b) }

      });

    const SUPPORTED = ['en', 'es', 'sl'];
    const BROWSER_MAP = { sl: 'sl' };
    const I18N = {};

    async function loadLang(l) {
      if (!I18N[l]) {
        const r = await fetch(`translations/${l}.json`);
        if (!r.ok) throw new Error(`Could not load ${l}`);
        I18N[l] = await r.json();
      }
      return I18N[l];
    }

    function applyStatic() {
      const tr = I18N[lang];
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const v = tr[el.dataset.i18n];
        if (v) el.textContent = v;
      });
      document.querySelectorAll('.lang-btn')
        .forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
    }

    async function setLang(l) {
      try {
        await loadLang(l);
        lang = l;
        document.documentElement.lang = l ===  l;
        build();
        applyStatic();
        try { localStorage.setItem('preferredLang', l); } catch (e) { }
      } catch (err) {
        console.error('i18n Error:', err);
      }
    }

    function initI18n() {
      let saved = null;
      try { saved = localStorage.getItem('preferredLang'); } catch (e) { }
      const b = navigator.language.split('-')[0];
      const detected = BROWSER_MAP[b] || b;
      setLang(SUPPORTED.includes(saved) ? saved
        : SUPPORTED.includes(detected) ? detected : 'en');
    }

    document.querySelectorAll('.lang-btn').forEach(btn =>
      btn.addEventListener('click', () => setLang(btn.dataset.lang)));

    initI18n();
    function layout() {
      $('#pl').textContent = T().ui.plain;
      const u = T().ui;
      document.querySelector('[data-i18n="cookie_text"]').textContent = u.cookieText;
      document.querySelector('[data-i18n="cookie_privacy"]').textContent = u.cookiePrivacy;
      $('#cookie-reject').textContent = u.cookieReject;
      $('#cookie-accept').textContent = u.cookieAccept;
      document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.toggle('active', btn.id === lang));
      const plain = false;
      sheets.forEach((e, i) => {
        e.style.transition = 'none'; e.style.transformOrigin = ''; e.style.zIndex = sheets.length - i;
        e.style.display = plain || (i >= cur && i <= cur + 1) ? '' : 'none';
        e.style.transform = plain ? '' : `rotate(${i === cur ? 0 : e.dataset.r}deg)`; e.style.opacity = 1; e.classList.remove('redraw'); e.inert = !plain && i !== cur
      });

      $('#back').style.display = cur === 0 ? 'none' : '';
      $('#home').style.display = cur === 0 ? 'none' : '';

      $('#next').style.display = cur === LAST() ? 'none' : '';
      $('#end').style.display = cur === LAST() ? 'none' : '';



      document.title = `${CONFIG.name} · ${cur + 1}/${sheets.length}`;
    }
    const seen = () => { try { return localStorage.getItem('padseen') } catch (e) { return 1 } };
    function markSeen() { try { localStorage.setItem('padseen', '1') } catch (e) { } document.querySelectorAll('.hint').forEach(h => h.remove()) }
    /* navigation */
    const LAST = () => sheets.length - 1;
    function tearOff(e, vx, vy, ang) {
      return new Promise(r => {
        if (reduce) { r(); return }
        e.style.transition = 'transform .4s cubic-bezier(.4,0,.8,.6),opacity .4s'; e.style.transform = `translate3d(${vx}px,${vy}px,0) rotate(${ang}rad)`; e.style.opacity = 0; setTimeout(r, 400)
      })
    }
    async function next(v) {
      if (busy || cur >= LAST()) return; busy = true; markSeen(); const e = sheets[cur];
      if (!v) { e.style.transformOrigin = '0 0'; v = { x: 40, y: -area.clientHeight * .9, a: .5 } }
      e.style.zIndex = 999; await tearOff(e, v.x, v.y, v.a); cur++; layout(); busy = false
    }
    function go(i) { if (busy || i === cur) return; cur = i; layout(); if (!reduce) sheets[cur].classList.add('redraw'); }
    $('#back').onclick = () => go(Math.max(0, cur - 1)); $('#home').onclick = () => go(0);
    $('#next').onclick = () => go(Math.max(0, cur + 1));
    $('#end').onclick = () => go(LAST());

    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.onclick = () => {
        lang = btn.id;
        document.documentElement.lang = lang;
        build();
      };
    });

    // Global event listener for inline video cookie consent buttons
    document.addEventListener('click', (e) => {
      const consentBtn = e.target.closest('[data-consent]');
      if (!consentBtn) return;

      // Force-set localStorage directly
      localStorage.setItem('cookie-consent-choice', 'accept');

      // Reload immediately
      window.location.reload();
    });
    addEventListener('keydown', e => {
      if (e.target.tagName === 'BUTTON' && e.key === ' ') return;
      if (['ArrowRight', 'ArrowDown'].includes(e.key)) next(); if (['ArrowLeft', 'ArrowUp'].includes(e.key)) go(Math.max(0, cur - 1)); if (e.key === 'Home') go(0)
    });
    /* drag-to-tear from any corner */
    let d = null, raf = 0; window.dragging = false;
    area.addEventListener('pointerdown', e => {
      const s = sheets[cur];
      // Add e.target.closest('[data-consent], .consent-msg') here so drag capture doesn't steal the click!
      if (reduce || busy || !s || cur >= LAST() || !s.contains(e.target) || e.target.closest('a,iframe,.vid,[data-consent], .consent-msg')) return;

      const r = s.getBoundingClientRect(), gx = e.clientX - r.left, gy = e.clientY - r.top, px = gx < r.width / 2 ? r.width : 0, py = gy < r.height / 2 ? r.height : 0;
      s.style.transformOrigin = `${px}px ${py}px`;
      d = { x: e.clientX, y: e.clientY, t: performance.now(), s, gx: gx - px, gy: gy - py, a: 0, dx: 0, dy: 0, curl: !!e.target.closest('.curl') };
      dragging = true;
      s.setPointerCapture(e.pointerId);
    });
    area.addEventListener('pointermove', e => {
      if (!d) return; const dx = e.clientX - d.x, dy = e.clientY - d.y, a = Math.atan2(d.gy + dy, d.gx + dx) - Math.atan2(d.gy, d.gx);
      d.a = Math.atan2(Math.sin(a), Math.cos(a)); d.dx = dx; d.dy = dy;
      if (!raf) raf = requestAnimationFrame(() => { raf = 0; if (d) d.s.style.transform = `translate3d(${d.dx * .15}px,${d.dy * .15}px,0) rotate(${d.a}rad)` })
    });
    const endDrag = () => {
      if (!d) return; const dd = d, s = dd.s, m = Math.hypot(dd.dx, dd.dy), v = m / (performance.now() - dd.t), h = area.clientHeight; d = null; dragging = false;
      if (m < 6) { s.style.transformOrigin = ''; if (dd.curl) next(); return }
      if (Math.abs(dd.a) > .4 || (v > .9 && m > h * .1)) { const k = h * 1.2 / m; next({ x: dd.dx * k, y: dd.dy * k, a: (dd.a * 2.2) || .5 }) }
      else { s.style.transition = 'transform .3s cubic-bezier(.3,1.5,.5,1)'; s.style.transform = 'translate3d(0,0,0) rotate(0rad)'; setTimeout(() => { if (!d) s.style.transformOrigin = '' }, 320) }
    };
    area.addEventListener('pointerup', endDrag); area.addEventListener('pointercancel', endDrag);
    /* lazy video embeds */
    area.addEventListener('click', e => {
      const b = e.target.closest('button.vid[data-v]'); if (!b) return;
      const f = document.createElement('iframe'); f.className = 'vid';
      f.src = `https://www.youtube-nocookie.com/embed/${b.dataset.v}?autoplay=1&rel=0`; f.allow = 'autoplay;encrypted-media;fullscreen'; f.title = 'Video'; b.replaceWith(f)
    });
    area.addEventListener('click', e => {
      if (e.target.closest('a,iframe,.vid,.consent-btn')) $('#cookie-accept').click();
      if (e.target.closest('video-consent')) $('#video-consent').click();

    });
    /* drifting tech badges (canvas, text-only, paused when hidden) */
    (function () {
      const cv = $('#bg'), x = cv.getContext('2d'); let W, H;

      const fileNames = Object.values({ ...CONFIG.frameworks, ...CONFIG.languages, ...CONFIG.markup, ...CONFIG.databases, ...CONFIG.devops })
        .flat()
        .map(item => typeof item === 'string' ? item : item.icon);
      const cols = ['#e2563b', '#2f7fd1', '#3fa36b', '#d9a321', '#8a5cc2'];

      // Preload valid SVGs
      const loadedIcons = fileNames.map(file => {
        const img = new Image();
        img.src = `img-icons/${file}`;
        return img;
      });

      const fit = () => {
        const r = Math.min(devicePixelRatio || 1, 1.5);
        W = cv.width = innerWidth * r;
        H = cv.height = innerHeight * r;
      };
      fit();
      addEventListener('resize', fit);

      const bs = fileNames.map((_, i) => ({
        img: loadedIcons[i],
        x: Math.random() * W,
        y: Math.random() * H,
        v: .15 + Math.random() * .35,
        a: Math.random() * 6,
        c: cols[i % cols.length],
        s: (W / (innerWidth < 600 ? 14 : 30)) * (.8 + Math.random() * .5) / 1.5
      }));

      let q = 0;
      (function f() {
        if (++q % 2 && !document.hidden && !reduce && !dragging && !busy) {
          x.clearRect(0, 0, W, H);
          bs.forEach(b => {
            b.y -= b.v;
            b.x += Math.sin(b.a += .004) * .3;
            if (b.y < -60) { b.y = H + 60; b.x = Math.random() * W; }

            x.save();
            x.translate(b.x, b.y);
            x.rotate(Math.sin(b.a) * .2);
            x.globalAlpha = .22;

            const iconSize = b.s * 1.1;
            const padding = iconSize * 0.35;
            const badgeSize = iconSize + padding;

            x.fillStyle = b.c;
            x.beginPath();
            x.roundRect(-badgeSize / 2, -badgeSize / 2, badgeSize, badgeSize, badgeSize * 0.3);
            x.fill();

            if (b.img.complete) {
              x.drawImage(b.img, -iconSize / 2, -iconSize / 2, iconSize, iconSize);
            }

            x.restore();
          });
        }
        requestAnimationFrame(f);
      })();
    })();
  </script>
</body>
